name: rmount
options:
  bundleIdPrefix: ai
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=*][arch=x86_64]: x86_64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    RMOUNT_BUILD_SHA: dev          # overridden by scripts/build-release.sh with the commit SHA
    RMOUNT_BUILD_KIND: dev         # "nightly" or "release", set by scripts/build-release.sh in CI
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  RMountCore:
    path: ..

targets:
  rmount:
    type: application
    platform: macOS
    sources:
      - path: rmount
        excludes:
          - "Resources/**"
      - path: rmount/Resources/rclone
        buildPhase: resources
        type: file
        optional: true
      - path: rmount/Resources/AppIcon.icns
        buildPhase: resources
        type: file
      - path: rmount/Resources/MenuBarIcon.png
        buildPhase: resources
        type: file
      - path: rmount/Resources/MenuBarIcon@2x.png
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.rmount
        PRODUCT_NAME: rmount
        INFOPLIST_FILE: rmount/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: rmount/Resources/rmount.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - package: RMountCore
        product: RMountCore

  rmount-lite:
    type: application
    platform: macOS
    sources:
      - path: rmount
        excludes:
          - "Resources/**"
      - path: rmount/Resources/AppIcon.icns
        buildPhase: resources
        type: file
      - path: rmount/Resources/MenuBarIcon.png
        buildPhase: resources
        type: file
      - path: rmount/Resources/MenuBarIcon@2x.png
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.rmount.lite
        PRODUCT_NAME: rmount-lite
        INFOPLIST_FILE: rmount/Resources/Info-Lite.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: rmount/Resources/rmount.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - package: RMountCore
        product: RMountCore
