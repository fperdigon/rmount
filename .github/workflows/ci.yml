name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never cancel main's runs

jobs:
  # GitHub Free allows 5 concurrent macOS jobs (20 in total), so macOS work is gated here, on a cheap
  # ubuntu runner: draft PRs run nothing, docs-only changes run no macOS job. A job skipped by `if:`
  # counts as passed for the required checks (build-test, app-build); a workflow skipped by
  # `paths-ignore` would stay "pending" and block the merge, so do not use paths-ignore.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does the change need the macOS jobs?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          cat changed.txt
          # Docs and repo metadata only: markdown, docs/, LICENSE, issue/PR templates.
          if grep -v -E '(\.md$|^docs/|^LICENSE|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE|^\.github/CODEOWNERS$|^\.github/FUNDING\.yml$)' changed.txt | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: macOS jobs skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0       # the new-code coverage gate diffs against the base branch

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Script tests (bench-mount, verify-dmg, release and cask scripts)
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Coverage report
        run: |
          PROFDATA="$(swift test --show-codecov-path | xargs dirname)/default.profdata"
          BUNDLE="$(find .build -name 'RMountCorePackageTests.xctest' -maxdepth 6 | head -1)"
          BIN="$BUNDLE/Contents/MacOS/RMountCorePackageTests"
          xcrun llvm-cov report "$BIN" -instr-profile "$PROFDATA" \
            -ignore-filename-regex '\.build|Tests' | tee coverage.txt
          {
            echo '### Test coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.txt

      # Rule: in a PR, at least 80% of the changed lines under Sources/ must be covered by the
      # unit tests above. UI code in App/ is not part of the package, so keep logic in RMountCore.
      - name: New-code coverage gate (>= 80%)
        if: github.event_name == 'pull_request'
        run: |
          PROFDATA="$(swift test --show-codecov-path | xargs dirname)/default.profdata"
          BUNDLE="$(find .build -name 'RMountCorePackageTests.xctest' -maxdepth 6 | head -1)"
          BIN="$BUNDLE/Contents/MacOS/RMountCorePackageTests"
          xcrun llvm-cov export -format=lcov "$BIN" -instr-profile "$PROFDATA" \
            -ignore-filename-regex '\.build|Tests' | sed "s#SF:$PWD/#SF:#" > coverage.lcov
          python3 -m venv .diffcover
          .diffcover/bin/pip install --quiet 'diff-cover>=9,<10'
          set +e
          .diffcover/bin/diff-cover coverage.lcov --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 --markdown-report diff-coverage.md
          status=$?
          set -e
          {
            echo '### New-code coverage (rule: at least 80% of changed lines in Sources/)'
            cat diff-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request' && always()
        with:
          name: diff-coverage
          path: diff-coverage.md
          if-no-files-found: ignore

  # Real Nextcloud (native PHP + SQLite; containers can't run on Apple Silicon runners)
  # driven through rmount's actual WebDAV backend, rclone and macOS mounts.
  nextcloud-integration:
    needs: build-test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start Nextcloud
        run: ./scripts/ci/start-nextcloud.sh

      - name: Nextcloud round-trip tests (NFS and WebDAV mounts)
        run: |
          set -o pipefail
          swift test --filter NextcloudIntegrationTests 2>&1 | tee it.log

      - name: Diagnostics
        if: failure()
        run: |
          tail -n 50 "$RUNNER_TEMP/nextcloud-it/server.log" || true
          tail -n 50 "$RUNNER_TEMP"/nextcloud-it/data/nextcloud.log || true
          mount | grep -i -E "rmount|127.0.0.1" || true

      - name: Failure digest
        if: failure()
        run: grep -E "error:|failed \(" it.log | grep -v warning | cut -c1-1200 || true

  # SFTP (asyncssh, password + key auth), FTP, S3 and SMB servers on localhost, driven through
  # rmount's real pipeline with NFS and WebDAV mounts.
  backends-integration:
    needs: build-test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start SFTP, FTP and S3 servers
        run: ./scripts/ci/start-backends.sh

      - name: Backend round-trip tests
        run: |
          set -o pipefail
          swift test --filter BackendIntegrationTests 2>&1 | tee it.log

      - name: Diagnostics
        if: failure()
        run: |
          tail -n 40 /tmp/rmount-it/sshd.log || true
          tail -n 5 /tmp/rmount-it/ftp.log /tmp/rmount-it/s3.log /tmp/rmount-it/smb.log || true
          tail -n 15 /tmp/rmount-it/samba/log.* 2>/dev/null || true
          mount | grep -i -E "rmount|127.0.0.1" || true

      - name: Failure digest
        if: failure()
        run: grep -E "error:|failed \(" it.log | grep -v warning | cut -c1-1200 || true

  # Azure Blob against Azurite (runs everywhere), then Backblaze B2 / Google Cloud Storage and Google
  # Drive, which need test-account secrets and skip without them (PRs from forks never get secrets).
  # One job instead of three: the secret-gated suites are skipped steps most of the time, and a
  # separate macOS runner for a skipped step only costs a slot. Each suite is still its own step.
  #   B2 / GCS: RMOUNT_IT_B2_ACCOUNT/_KEY/_BUCKET and RMOUNT_IT_GCS_CREDENTIALS/_BUCKET (optional
  #   _PROJECT); no emulator exists for B2's native API.
  #   Google Drive: RMOUNT_IT_GDRIVE_TOKEN (output of `rclone authorize drive`; optionally
  #   _CLIENT_ID/_CLIENT_SECRET and _FOLDER).
  # The old MACSH_IT_* secret names still work.
  cloud-integration:
    needs: build-test
    runs-on: macos-15
    timeout-minutes: 40
    env:
      RMOUNT_IT_B2_ACCOUNT: ${{ secrets.RMOUNT_IT_B2_ACCOUNT || secrets.MACSH_IT_B2_ACCOUNT }}
      RMOUNT_IT_B2_KEY: ${{ secrets.RMOUNT_IT_B2_KEY || secrets.MACSH_IT_B2_KEY }}
      RMOUNT_IT_B2_BUCKET: ${{ secrets.RMOUNT_IT_B2_BUCKET || secrets.MACSH_IT_B2_BUCKET }}
      RMOUNT_IT_GCS_CREDENTIALS: ${{ secrets.RMOUNT_IT_GCS_CREDENTIALS || secrets.MACSH_IT_GCS_CREDENTIALS }}
      RMOUNT_IT_GCS_BUCKET: ${{ secrets.RMOUNT_IT_GCS_BUCKET || secrets.MACSH_IT_GCS_BUCKET }}
      RMOUNT_IT_GCS_PROJECT: ${{ secrets.RMOUNT_IT_GCS_PROJECT || secrets.MACSH_IT_GCS_PROJECT }}
      RMOUNT_IT_GDRIVE_TOKEN: ${{ secrets.RMOUNT_IT_GDRIVE_TOKEN || secrets.MACSH_IT_GDRIVE_TOKEN }}
      RMOUNT_IT_GDRIVE_CLIENT_ID: ${{ secrets.RMOUNT_IT_GDRIVE_CLIENT_ID || secrets.MACSH_IT_GDRIVE_CLIENT_ID }}
      RMOUNT_IT_GDRIVE_CLIENT_SECRET: ${{ secrets.RMOUNT_IT_GDRIVE_CLIENT_SECRET || secrets.MACSH_IT_GDRIVE_CLIENT_SECRET }}
      RMOUNT_IT_GDRIVE_FOLDER: ${{ secrets.RMOUNT_IT_GDRIVE_FOLDER || secrets.MACSH_IT_GDRIVE_FOLDER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start Azurite
        run: ./scripts/ci/start-azurite.sh

      - name: Azure round-trip tests (NFS and WebDAV mounts)
        run: |
          set -o pipefail
          swift test --filter AzureIntegrationTests 2>&1 | tee it.log

      - name: Check for test accounts
        run: |
          [ -n "$RMOUNT_IT_B2_KEY" ] || echo "::warning::RMOUNT_IT_B2_* secrets not set - Backblaze B2 test skipped"
          [ -n "$RMOUNT_IT_GCS_CREDENTIALS" ] || echo "::warning::RMOUNT_IT_GCS_* secrets not set - Google Cloud Storage test skipped"
          [ -n "$RMOUNT_IT_GDRIVE_TOKEN" ] || echo "::warning::RMOUNT_IT_GDRIVE_TOKEN secret not set - Google Drive integration tests are skipped"

      - name: Install rclone
        if: env.RMOUNT_IT_B2_KEY != '' || env.RMOUNT_IT_GCS_CREDENTIALS != '' || env.RMOUNT_IT_GDRIVE_TOKEN != ''
        run: brew install rclone

      - name: B2 and GCS round-trip tests
        if: env.RMOUNT_IT_B2_KEY != '' || env.RMOUNT_IT_GCS_CREDENTIALS != ''
        run: swift test --filter NativeCloudAccountTests

      - name: Google Drive round-trip and token refresh tests
        if: env.RMOUNT_IT_GDRIVE_TOKEN != ''
        run: swift test --filter GoogleDriveIntegrationTests

      - name: Diagnostics
        if: failure()
        run: |
          tail -n 30 /tmp/rmount-azurite/azurite.log || true
          mount | grep -i -E "rmount|127.0.0.1" || true

      - name: Failure digest
        if: failure()
        run: grep -E "error:|failed \(" it.log | grep -v warning | cut -c1-1200 || true

  # Compiles the SwiftUI app (rmount-lite shares all sources with rmount). The package tests do
  # not build App/, so without this a broken view only shows up in the post-merge release run.
  app-build:
    needs: build-test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: cd App && xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project App/rmount.xcodeproj -scheme rmount-lite -configuration Debug \
            -derivedDataPath App/build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
